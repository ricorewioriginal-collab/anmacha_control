<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>Handy-Sender · AirDeck</title>
<link rel="icon" href="icons/icon-32.png" type="image/png">
<style>
:root {
  --bg: #070914; --panel: #121230cc; --panel-solid: #12162e; --line: #2a2f52; --text: #eef1fb; --muted: #97a0c3;
  --accent: #7c5cff; --accent2: #2f8cff; --ok: #22d3a8; --warn: #f5c04a; --bad: #ff4d6d;
  --grad-brand: linear-gradient(135deg, #7c5cff 0%, #2f8cff 100%);
  --grad-live: linear-gradient(135deg, #ff5673 0%, #ff2f6e 60%, #b3144d 100%);
  --grad-ok: linear-gradient(135deg, #22d3a8 0%, #16a887 100%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--text); font: 15px/1.5 'Segoe UI', system-ui, Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  background: radial-gradient(900px 500px at 15% -10%, rgba(124,92,255,.35), transparent 60%),
              radial-gradient(700px 420px at 100% 0%, rgba(47,140,255,.28), transparent 55%),
              radial-gradient(600px 500px at 50% 120%, rgba(124,92,255,.18), transparent 60%),
              var(--bg);
  background-attachment: fixed;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 32px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
header .logo {
  width: 44px; height: 44px; border-radius: 13px; background: var(--grad-brand); display: flex; align-items: center;
  justify-content: center; font-size: 20px; box-shadow: 0 6px 18px rgba(124,92,255,.45); flex: none;
}
h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 14px; margin: 0 0 10px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .04em; opacity: .85; }
.sub, .muted { color: var(--muted); font-size: 13px; }
.card {
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0)), var(--panel-solid);
  border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-bottom: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); backdrop-filter: blur(6px);
}
.pill {
  font-size: 11px; font-weight: 800; letter-spacing: .06em; border-radius: 999px; border: 1px solid var(--line);
  padding: 5px 12px; color: var(--muted); margin-left: auto; white-space: nowrap; background: rgba(255,255,255,.03);
}
.pill.on { color: #fff; border-color: transparent; background: var(--grad-live); box-shadow: 0 0 0 3px rgba(255,45,110,.18), 0 0 16px rgba(255,45,110,.55); animation: pulse-pill 1.6s ease-in-out infinite; }
.pill.wait { color: #2b1c00; border-color: transparent; background: linear-gradient(135deg, #ffe27a, #f5c04a); }
.pill.bad { color: #fff; background: var(--bad); border-color: transparent; }
@keyframes pulse-pill { 0%, 100% { box-shadow: 0 0 0 3px rgba(255,45,110,.18), 0 0 14px rgba(255,45,110,.5); } 50% { box-shadow: 0 0 0 6px rgba(255,45,110,.1), 0 0 24px rgba(255,45,110,.75); } }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.big {
  flex: 1; min-height: 64px; font-size: 17px; font-weight: 700; border-radius: 16px; border: 0;
  background: var(--grad-brand); color: #fff; font-family: inherit; cursor: pointer;
  box-shadow: 0 8px 22px rgba(124,92,255,.35); transition: transform .08s ease, box-shadow .2s ease;
}
.big:active { transform: scale(.98); }
.big.stop { background: var(--grad-live); box-shadow: 0 8px 26px rgba(255,45,110,.5); animation: pulse-btn 1.8s ease-in-out infinite; }
@keyframes pulse-btn { 0%, 100% { box-shadow: 0 8px 22px rgba(255,45,110,.4); } 50% { box-shadow: 0 8px 34px rgba(255,45,110,.7); } }
.big.mic { background: rgba(255,255,255,.04); color: var(--text); border: 1px solid var(--line); box-shadow: none; }
.big.mic[aria-pressed="true"] { background: linear-gradient(135deg, rgba(255,77,109,.35), rgba(255,45,110,.2)); border-color: var(--bad); color: #fff; box-shadow: 0 0 18px rgba(255,77,109,.35); }
.btn { min-height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--text); font: inherit; cursor: pointer; }
.btn.primary { background: var(--grad-brand); border-color: transparent; color: #fff; font-weight: 700; box-shadow: 0 6px 16px rgba(124,92,255,.35); }
.btn:disabled, .big:disabled { opacity: .4; cursor: default; animation: none; box-shadow: none; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input, select {
  width: 100%; background: rgba(255,255,255,.04); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 11px; font: inherit;
}
input[type="checkbox"] { width: auto; margin-right: 8px; accent-color: var(--accent); }
input[type="range"] { padding: 0; accent-color: var(--accent); }
.check { display: flex; align-items: center; color: var(--text); font-size: 14px; margin-top: 10px; }
.grid { display: grid; grid-template-columns: 1fr 110px; gap: 0 10px; }
.meter { height: 12px; border-radius: 8px; background: rgba(255,255,255,.04); border: 1px solid var(--line); overflow: hidden; margin: 4px 0 10px; }
.meter i { display: block; height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg, var(--ok) 65%, var(--warn) 85%, var(--bad)); box-shadow: 0 0 10px rgba(34,211,168,.35); transition: width .1s linear; }
.lvl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
ul { list-style: none; margin: 8px 0 0; padding: 0; }
li { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid var(--line); border-radius: 10px; }
li span { flex: 1; overflow-wrap: anywhere; }
li.cur { background: linear-gradient(90deg, rgba(124,92,255,.22), rgba(47,140,255,.08)); border: 1px solid rgba(124,92,255,.4); }
li .x { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
.prog { height: 5px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.prog i { display: block; height: 100%; width: 0; background: var(--grad-brand); border-radius: 4px; }
.msg { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255,77,109,.12); border: 1px solid rgba(255,77,109,.4); color: #ffd7de; }
details summary { cursor: pointer; font-weight: 700; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: '⚙ '; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 16px 12px 8px; }
footer a { color: var(--accent2); text-decoration: none; font-weight: 600; }
.badge-wrap { display: flex; justify-content: center; padding: 6px 0 18px; }
.badge {
  width: 128px; height: 128px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 46px; background: radial-gradient(circle at 35% 30%, rgba(124,92,255,.5), rgba(18,22,46,.9) 70%);
  border: 1px solid var(--line); box-shadow: 0 0 0 1px rgba(124,92,255,.15), 0 10px 30px rgba(0,0,0,.35);
  transition: box-shadow .3s ease, background .3s ease;
}
.badge.live { background: radial-gradient(circle at 35% 30%, rgba(255,86,115,.6), rgba(18,22,46,.9) 70%); box-shadow: 0 0 0 8px rgba(255,45,110,.12), 0 0 40px rgba(255,45,110,.55); animation: badge-pulse 1.6s ease-in-out infinite; }
@keyframes badge-pulse { 0%, 100% { box-shadow: 0 0 0 8px rgba(255,45,110,.1), 0 0 32px rgba(255,45,110,.45); } 50% { box-shadow: 0 0 0 14px rgba(255,45,110,.06), 0 0 54px rgba(255,45,110,.7); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">📻</div>
    <div><h1>Handy-Sender</h1><div class="sub">Live senden direkt vom Handy – ohne AirDeck-Server</div></div>
    <span class="pill" id="state">AUS</span>
  </header>
  <main id="main"><div class="card muted">Wird geladen …</div></main>
  <footer>
    <a href="index.html" id="to-server">Mit AirDeck-Server verbinden</a><br>
    Powered by AirDeck · AnMaCha Radioproduktion &amp; RicoReWi
  </footer>
</div>
<script src="js/handy.js"></script>
</body>
</html>
