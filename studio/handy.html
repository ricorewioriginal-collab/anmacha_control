<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>Handy-Sender · AirDeck</title>
<link rel="icon" href="icons/icon-32.png" type="image/png">
<style>
:root { --bg: #07101f; --panel: #0d1a30; --line: #1f2d4a; --text: #e6edf8; --muted: #8fa3c4; --accent: #2f8cff; --ok: #22c55e; --warn: #eab308; --bad: #ef4444; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'Segoe UI', system-ui, Roboto, sans-serif; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px 24px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
header img { width: 40px; height: 40px; border-radius: 10px; }
h1 { font-size: 19px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 8px; }
.sub, .muted { color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.pill { font-size: 12px; font-weight: 700; letter-spacing: .05em; border-radius: 999px; border: 1px solid var(--line); padding: 3px 10px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.pill.on { color: #fecaca; border-color: rgba(239,68,68,.7); background: rgba(239,68,68,.18); }
.pill.wait { color: #fde68a; border-color: rgba(234,179,8,.6); }
.pill.bad { color: #fff; background: #b91c1c; border-color: #ef4444; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.big { flex: 1; min-height: 58px; font-size: 17px; font-weight: 700; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-family: inherit; cursor: pointer; }
.big.stop { background: #b91c1c; border-color: #ef4444; }
.big.mic { background: #0a1426; color: var(--text); border-color: var(--line); }
.big.mic[aria-pressed="true"] { background: rgba(239,68,68,.25); border-color: var(--bad); color: #fff; }
.btn { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: #0a1426; color: var(--text); font: inherit; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn:disabled, .big:disabled { opacity: .45; cursor: default; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input, select { width: 100%; background: #0a1426; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; }
input[type="checkbox"] { width: auto; margin-right: 8px; }
input[type="range"] { padding: 0; }
.check { display: flex; align-items: center; color: var(--text); font-size: 14px; margin-top: 10px; }
.grid { display: grid; grid-template-columns: 1fr 110px; gap: 0 10px; }
.meter { height: 10px; border-radius: 6px; background: #0a1426; border: 1px solid var(--line); overflow: hidden; margin: 4px 0 8px; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ok) 70%, var(--warn) 85%, var(--bad)); transition: width .1s linear; }
.lvl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
ul { list-style: none; margin: 8px 0 0; padding: 0; }
li { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
li span { flex: 1; overflow-wrap: anywhere; }
li.cur { background: rgba(47,140,255,.14); border-radius: 8px; }
li .x { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
.prog { height: 4px; background: #0a1426; border-radius: 3px; overflow: hidden; margin-top: 6px; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); }
.msg { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.45); }
details summary { cursor: pointer; font-weight: 600; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 12px; }
footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icons/icon-192.png" alt="">
    <div><h1>Handy-Sender</h1><div class="sub">Live senden direkt vom Handy – ohne AirDeck-Server</div></div>
    <span class="pill" id="state">AUS</span>
  </header>
  <main id="main"><div class="card muted">Wird geladen …</div></main>
  <footer>
    <a href="index.html" id="to-server">Mit AirDeck-Server verbinden</a><br>
    Powered by AirDeck · AnMaCha Radioproduktion &amp; RicoReWi
  </footer>
</div>
<script src="js/handy.js"></script>
</body>
</html>
