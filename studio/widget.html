<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · AirDeck</title>
<style>
:root { --bg: #0d1a30; --text: #e6edf8; --muted: #8fa3c4; --line: #1f2d4a; --accent: #2f8cff; color-scheme: dark; }
:root.light { --bg: #ffffff; --text: #101828; --muted: #5b6b86; --line: #e3e8f0; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font: 14px/1.4 'Segoe UI', system-ui, Roboto, sans-serif; color: var(--text); }
.w { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
.cover { width: 64px; height: 64px; border-radius: 10px; background: var(--accent) center/cover no-repeat; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 20px; }
.st { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa6b8; }
.dot.on { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
.t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 16px; cursor: pointer; flex: none; }
button:disabled { opacity: .4; cursor: default; }
.prog { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); }
ul { grid-column: 1 / -1; list-style: none; margin: 4px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
li { display: flex; gap: 8px; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="w" id="w">
  <div class="cover" id="cover">♪</div>
  <div>
    <div class="st"><span class="dot" id="dot"></span><span id="name">…</span></div>
    <div class="t" id="title">–</div>
    <div class="a" id="artist"></div>
    <div class="row"><button id="play" title="Abspielen" aria-label="Abspielen" disabled>▶</button><div class="prog"><i id="pg"></i></div></div>
  </div>
  <ul id="hist" hidden></ul>
</div>
<script src="js/widget.js"></script>
</body>
</html>
