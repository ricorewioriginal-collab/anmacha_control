# Einfügen in die bestehende nginx-Konfiguration (z. B. als eigene Datei unter
# /etc/nginx/sites-available/airdeck-demo.conf, dann per Symlink in sites-enabled aktivieren, oder
# als zusätzlichen server{}-Block in die schon vorhandene HTTPS-Konfiguration für die Domain einfügen).
# HTTPS/Zertifikat übernimmt weiterhin euer bestehendes Setup (z. B. certbot) - hier nur der Rückverweis
# auf den lokal laufenden Demo-Container (127.0.0.1:8751, siehe docker-compose.demo.yml).

server {
    listen 443 ssl http2;
    server_name airdeck-demo.ricorewi-radio.de;

    # Zertifikat: Pfad an euer bestehendes Setup anpassen (z. B. certbot-Ausgabe für diese Subdomain,
    # oder ein Wildcard-Zertifikat für *.ricorewi-radio.de, falls vorhanden).
    ssl_certificate     /etc/letsencrypt/live/airdeck-demo.ricorewi-radio.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airdeck-demo.ricorewi-radio.de/privkey.pem;

    client_max_body_size 200m;  # Musik-Uploads in der Demo

    location / {
        proxy_pass http://127.0.0.1:8751;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live-Ereignisse (Server-Sent Events) dürfen nicht gepuffert werden, sonst kommen
        # Now-Playing-Updates im Studio nur verzögert an.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name airdeck-demo.ricorewi-radio.de;
    return 301 https://$host$request_uri;
}
