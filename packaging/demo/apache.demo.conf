# Einfügen als eigene Datei unter /etc/apache2/sites-available/airdeck-demo.conf, dann aktivieren:
#   a2enmod proxy proxy_http
#   a2ensite airdeck-demo
#   systemctl reload apache2
# HTTPS/Zertifikat übernimmt weiterhin euer bestehendes Setup (z. B. certbot --apache). Der Container
# selbst ist nur auf 127.0.0.1:8751 erreichbar (siehe docker-compose.demo.yml).

<VirtualHost *:80>
    ServerName airdeck-demo.ricorewi-radio.de
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName airdeck-demo.ricorewi-radio.de

    # Zertifikat: Pfad an euer bestehendes Setup anpassen (z. B. von certbot für diese Subdomain).
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/airdeck-demo.ricorewi-radio.de/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/airdeck-demo.ricorewi-radio.de/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    # Live-Ereignisse (Server-Sent Events) dürfen nicht gepuffert werden, sonst kommen
    # Now-Playing-Updates im Studio nur verzögert an.
    SetEnv proxy-sendchunked 1
    ProxyPass        / http://127.0.0.1:8751/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8751/
</VirtualHost>
