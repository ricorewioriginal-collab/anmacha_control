# Für KeyHelp (oder ein anderes Panel, das Apache/Zertifikate selbst verwaltet):
# Subdomain airdeck-demo.ricorewi-radio.de im Panel anlegen, Let's-Encrypt-SSL dort aktivieren,
# und NUR den Block unten unter "Apache-Direktiven" / "Individuelle Konfiguration" der Subdomain
# eintragen - das Panel kümmert sich selbst um ServerName, Zertifikatspfade und den VirtualHost-Rahmen.
#
# --- ab hier ins Panel einfügen ---
ProxyPreserveHost On
ProxyRequests Off
# Live-Ereignisse (Server-Sent Events) dürfen nicht gepuffert werden, sonst kommen
# Now-Playing-Updates im Studio nur verzögert an.
SetEnv proxy-sendchunked 1
ProxyPass        / http://127.0.0.1:8751/ flushpackets=on
ProxyPassReverse / http://127.0.0.1:8751/
# --- bis hier ---
#
# Ohne Panel (klassisches Apache, eigene vhost-Datei unter /etc/apache2/sites-available/):
# den Block oben in einen <VirtualHost *:443>...</VirtualHost> packen, dort zusätzlich ServerName,
# SSLEngine on, SSLCertificateFile/SSLCertificateKeyFile setzen, dann:
#   a2enmod proxy proxy_http ssl
#   a2ensite airdeck-demo
#   systemctl reload apache2
