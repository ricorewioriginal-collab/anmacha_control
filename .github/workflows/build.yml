name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # hängende Tests (z. B. offene Datenbankverbindungen) nicht stundenlang laufen lassen
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-pw
          MYSQL_DATABASE: airdeck_test
          MYSQL_USER: airdeck
          MYSQL_PASSWORD: airdeck-pw
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-pw"
          --health-interval=5s --health-timeout=5s --health-retries=20
      # Datenbankschicht: dieselben Tests gegen SQLite, PostgreSQL, MariaDB und MySQL (DATABASE.md „Tests“)
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: airdeck
          POSTGRES_PASSWORD: airdeck-pw
          POSTGRES_DB: airdeck_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U airdeck" --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root-pw
          MARIADB_DATABASE: airdeck_test
          MARIADB_USER: airdeck
          MARIADB_PASSWORD: airdeck-pw
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      AIRDECK_TEST_MYSQL: 127.0.0.1:3306:airdeck:airdeck-pw:airdeck_test
      AIRDECK_TEST_PG: postgres://airdeck:airdeck-pw@127.0.0.1:5432/airdeck_test
      AIRDECK_TEST_MYSQL_URL: mysql://airdeck:airdeck-pw@127.0.0.1:3306/airdeck_test
      AIRDECK_TEST_MARIADB_URL: mysql://airdeck:airdeck-pw@127.0.0.1:3307/airdeck_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: ffmpeg (für Playout-Integrationstest)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run check

  windows:
    needs: [test, android]
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: AirDeck bauen (Engine als Node Single Executable + Windows-Programm)
        run: node scripts/build.mjs --sea
      - name: Programme signieren (nur mit hinterlegtem Zertifikat)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP/cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          foreach ($f in @('dist/AirDeck/AirDeck.exe', 'dist/AirDeck/airdeck-engine.exe')) {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d AirDeck $f
            if ($LASTEXITCODE -ne 0) { throw "Signieren fehlgeschlagen: $f" }
          }
          Remove-Item $pfx
      - name: Android-App beilegen (Download direkt aus AirDeck)
        uses: actions/download-artifact@v4
        with: { name: AirDeck-Android, path: dist/AirDeck/android }
      - name: ffmpeg beilegen
        shell: pwsh
        run: |
          $dest = "dist/AirDeck/ffmpeg"
          foreach ($variant in @('lgpl', 'gpl')) {
            $zip = "$env:RUNNER_TEMP/ffmpeg-$variant.zip"
            Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-$variant.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/ff-$variant" -Force
            $bin = Get-ChildItem "$env:RUNNER_TEMP/ff-$variant" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            $enc = & $bin.FullName -hide_banner -encoders
            if (($enc | Select-String 'libmp3lame') -and ($enc | Select-String 'libopus')) {
              Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName 'ffprobe.exe'), (Join-Path $bin.DirectoryName 'ffplay.exe') $dest
              Get-ChildItem (Split-Path $bin.DirectoryName) -Filter 'LICENSE*' | Copy-Item -Destination $dest
              "ffmpeg-Build: BtbN/FFmpeg-Builds ($variant), https://github.com/BtbN/FFmpeg-Builds" | Out-File "$dest/QUELLE.txt"
              Write-Host "ffmpeg ($variant) beigelegt"
              exit 0
            }
          }
          throw 'Kein ffmpeg-Build mit libmp3lame + libopus gefunden'
      - name: Smoke-Test
        shell: pwsh
        run: |
          $env:AIRDECK_DATA = "$env:RUNNER_TEMP/airdeck-data"
          $env:AIRDECK_PORT = '8753'
          $engine = 'dist/AirDeck/airdeck-engine.exe'
          if (-not (Test-Path dist/AirDeck/AirDeck.exe)) { throw 'Windows-Programm AirDeck.exe fehlt' }
          # Engine ohne Konsole: Ausgabe über Umleitung prüfen
          Start-Process -FilePath $engine -ArgumentList '--new-admin-token' -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/out.txt"
          $out = Get-Content "$env:RUNNER_TEMP/out.txt"
          $out
          if (-not ($out | Select-String 'ffmpeg version')) { throw 'ffmpeg wurde nicht erkannt' }
          if (-not (Test-Path "$env:AIRDECK_DATA/logs/airdeck.log")) { throw 'Logdatei fehlt' }
          $p = Start-Process -FilePath $engine -ArgumentList '--headless', '--no-tray' -PassThru
          Start-Sleep -Seconds 5
          $r = Invoke-RestMethod http://127.0.0.1:8753/api/v1/health
          # Studio-Oberfläche muss wirklich ausgeliefert werden (nicht nur die API)
          $page = Invoke-WebRequest http://127.0.0.1:8753/ -UseBasicParsing
          $js = Invoke-WebRequest http://127.0.0.1:8753/js/app.js -UseBasicParsing
          # Adresse für das Programmfenster (Zugang dieses PCs, Engine läuft)
          Start-Process -FilePath $engine -ArgumentList '--print-url' -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/url.txt"
          $info = Get-Content "$env:RUNNER_TEMP/url.txt" -Raw | ConvertFrom-Json
          if (-not $info.running -or -not ($info.url -match '^http://127\.0\.0\.1:8753/#token=ad_')) { throw "print-url liefert nichts Brauchbares: $($info.url -replace 'token=.*','token=…')" }
          # sauber beenden wie über das Tray-Symbol
          Start-Process -FilePath $engine -ArgumentList '--stop' -Wait -NoNewWindow
          $p.WaitForExit(8000) | Out-Null
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; throw 'AirDeck --stop hat die Instanz nicht beendet' }
          if (-not $r.ok) { throw 'Health-Check fehlgeschlagen' }
          if ($page.StatusCode -ne 200 -or -not ($page.Content -match 'AirDeck')) { throw 'Studio-Startseite wird nicht ausgeliefert' }
          if ($js.StatusCode -ne 200) { throw 'Studio-Skripte werden nicht ausgeliefert' }
          Write-Host 'Engine startet und antwortet.'
          # Windows-Programm: startet die Engine selbst (nur Infobereich, ohne Fenster)
          $env:AIRDECK_PORT = '8756'
          $w = Start-Process -FilePath dist/AirDeck/AirDeck.exe -ArgumentList '--minimized' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) { Start-Sleep -Seconds 1; try { $ok = (Invoke-RestMethod http://127.0.0.1:8756/api/v1/health).ok } catch {} }
          Start-Process -FilePath $engine -ArgumentList '--stop' -Wait -NoNewWindow
          if (-not $w.HasExited) { Stop-Process -Id $w.Id -Force }
          if (-not $ok) { throw 'AirDeck.exe hat die Engine nicht gestartet' }
          Write-Host 'AirDeck.exe startet die Engine.'
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $found) { choco install innosetup -y --no-progress | Out-Null; $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
            $iscc = $found
          } else { $iscc = $iscc.Source }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & $iscc "/DAppVersion=$version" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup fehlgeschlagen' }
          Get-ChildItem dist/AirDeck-Setup-*.exe
      - name: Installer signieren (nur mit hinterlegtem Zertifikat)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP/cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          foreach ($f in @((Get-ChildItem dist/AirDeck-Setup-*.exe).FullName)) {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d AirDeck $f
            if ($LASTEXITCODE -ne 0) { throw "Signieren fehlgeschlagen: $f" }
          }
          Remove-Item $pfx
      - name: Installer-Test (still installieren, starten, deinstallieren)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/AirDeck-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=""' -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA/Programs/AirDeck/AirDeck.exe")) { throw 'AirDeck.exe nach Installation nicht gefunden' }
          $exe = "$env:LOCALAPPDATA/Programs/AirDeck/airdeck-engine.exe"
          if (-not (Test-Path $exe)) { throw 'airdeck-engine.exe nach Installation nicht gefunden' }
          $env:AIRDECK_DATA = "$env:RUNNER_TEMP/airdeck-inst"
          $env:AIRDECK_PORT = '8755'
          $p = Start-Process $exe -ArgumentList '--headless', '--no-tray' -PassThru
          Start-Sleep -Seconds 5
          $r = Invoke-RestMethod http://127.0.0.1:8755/api/v1/health
          $page = Invoke-WebRequest http://127.0.0.1:8755/ -UseBasicParsing
          Stop-Process -Id $p.Id -Force
          if (-not $r.ok) { throw 'Installierte Version antwortet nicht' }
          if ($page.StatusCode -ne 200) { throw 'Installierte Version liefert das Studio nicht aus' }
          Start-Process "$env:LOCALAPPDATA/Programs/AirDeck/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Write-Host 'Installer: Installation, Start und Deinstallation OK'
      - uses: actions/upload-artifact@v4
        with:
          name: AirDeck-Windows-Installer
          path: dist/AirDeck-Setup-*.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: AirDeck-Windows
          path: dist/AirDeck
          retention-days: 30

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t airdeck:ci .
      - name: Container starten und prüfen
        run: |
          docker run -d --name airdeck -p 8750:8750 airdeck:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8750/api/v1/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8750/api/v1/health
          curl -fs http://127.0.0.1:8750/ | grep -q AirDeck
          docker logs airdeck | tee log.txt
          grep -q "ffmpeg version" log.txt || (echo "ffmpeg fehlt im Container" && exit 1)
          grep -q "Admin-Token" log.txt || (echo "Admin-Token wird nicht ausgegeben" && exit 1)
          # Liquidsoap-Skript aus der laufenden Instanz erzeugen und mit echtem Liquidsoap prüfen
          TOKEN=$(grep -A1 "Admin-Token" log.txt | tail -1 | tr -d ' \r')
          curl -fs -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"Test","type":"icecast","host":"127.0.0.1","port":8000,"mount":"/stream","username":"source","password":"x-geheim-1","priority":5}' \
            http://127.0.0.1:8750/api/v1/stations/main/outputs > /dev/null
          curl -fs -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8750/api/v1/stations/main/liquidsoap -o airdeck.liq
          cat airdeck.liq
          ! grep -q "x-geheim-1" airdeck.liq || (echo "Passwort im Skript!" && exit 1)
          docker run --rm -v "$PWD:/s" --entrypoint liquidsoap savonet/liquidsoap:v2.2.5 --check /s/airdeck.liq
          docker stop -t 10 airdeck
          test "$(docker inspect -f '{{.State.ExitCode}}' airdeck)" = "0" || (echo "Container wurde nicht sauber beendet" && exit 1)
      - name: docker compose mit PostgreSQL
        run: |
          docker rm -f airdeck > /dev/null
          docker compose up -d
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8750/api/v1/health && break; sleep 1; done
          docker compose logs airdeck | tee log.txt
          grep -q "Datenbank: postgres" log.txt || (echo "PostgreSQL wird nicht genutzt" && exit 1)
          # compose setzt „airdeck  | “ vor jede Zeile – Token direkt am Muster erkennen
          TOKEN=$(grep -A1 "Admin-Token" log.txt | grep -o 'ad_[A-Za-z0-9_-]*' | head -1)
          test -n "$TOKEN" || (echo "Admin-Token nicht gefunden" && exit 1)
          curl -fs -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"id":"ci","name":"CI Radio"}' http://127.0.0.1:8750/api/v1/stations > /dev/null
          # Neustart: Daten müssen aus PostgreSQL kommen
          docker compose restart airdeck
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8750/api/v1/health > /dev/null && break; sleep 1; done
          curl -fs -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8750/api/v1/stations | grep -q '"id":"ci"' || (echo "Sender nach Neustart verloren" && exit 1)
          curl -fs -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8750/api/v1/database | tee db.json | grep -q '"engine":"PostgreSQL"'
          docker compose down

  demo:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demo-Image bauen und Vollfunktions-Reset pruefen
        run: |
          set -e
          docker compose -f packaging/demo/docker-compose.demo.yml build
          sh packaging/demo/reset-demo.sh
          curl -fs http://127.0.0.1:8751/api/v1/health | grep -q '"ok":true'

          LOGIN=$(curl -fs -X POST -H 'Content-Type: application/json'             -d '{"username":"demo","password":"airdeck-demo"}'             http://127.0.0.1:8751/api/v1/auth/login)
          TOKEN=$(printf '%s' "$LOGIN" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).token||''))")
          test -n "$TOKEN" || (echo "Demo-Login fehlgeschlagen" && exit 1)

          WALL=$(curl -fs -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8751/api/v1/stations/main/cardwall)
          printf '%s' "$WALL" | grep -q 'Demo Jingle' || (echo "Demo-Cardwall ist leer" && exit 1)
          printf '%s' "$WALL" | grep -q 'AirDeck-FM ID' || (echo "Demo-Station-ID fehlt im Cardwall" && exit 1)

          curl -fs -X POST -H "Authorization: Bearer $TOKEN"             http://127.0.0.1:8751/api/v1/stations/main/cardwall/cart1/trigger > /dev/null
          sleep 2
          curl -fs -H "Authorization: Bearer $TOKEN"             http://127.0.0.1:8751/api/v1/stations/main/playout | grep -q '"running":true'             || (echo "Demo-Playout/Cardwall startet nicht" && exit 1)

          docker compose -f packaging/demo/docker-compose.demo.yml logs airdeck-demo
          docker compose -f packaging/demo/docker-compose.demo.yml down -v
          echo "Demo: Login, Cardwall, Playout und Reset OK"

  # docs/DOCKER.md verspricht ausdrücklich "Raspberry Pi 4/5 mit 64 Bit" - bisher baute und testete die
  # CI das Image nur für amd64 (der GitHub-Runner selbst). Per QEMU-Emulation wirklich für arm64 bauen
  # und starten, damit dieses Versprechen nicht nur eine unbelegte Behauptung in der Doku ist.
  docker-arm64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - name: Image für linux/arm64 bauen (emuliert)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: airdeck:ci-arm64
      - name: Container starten und prüfen (arm64 unter QEMU)
        run: |
          docker run -d --name airdeck-arm64 --platform linux/arm64 -p 8751:8750 airdeck:ci-arm64
          # QEMU-Emulation ist deutlich langsamer als natives amd64 - großzügig warten (bis zu 6 Minuten)
          for i in $(seq 1 180); do curl -fs http://127.0.0.1:8751/api/v1/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8751/api/v1/health
          curl -fs http://127.0.0.1:8751/ | grep -q AirDeck
          docker exec airdeck-arm64 uname -m | grep -q aarch64
          docker logs airdeck-arm64 | tee log-arm64.txt
          grep -q "ffmpeg version" log-arm64.txt || (echo "ffmpeg fehlt/startet nicht unter arm64" && exit 1)
          grep -q "Admin-Token" log-arm64.txt || (echo "Admin-Token wird nicht ausgegeben" && exit 1)
          docker stop -t 10 airdeck-arm64
          test "$(docker inspect -f '{{.State.ExitCode}}' airdeck-arm64)" = "0" || (echo "Container wurde nicht sauber beendet" && exit 1)

  # Linux-Paket: .deb mit systemd-Dienst „airdeck-server“ (Schritt 7 der Architektur, eigener Benutzer,
  # Daten unter /var/lib/airdeck). Läuft auf einem echten ubuntu-latest-Runner (VM mit systemd als PID 1).
  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Debian-Paket bauen
        run: npm run build:linux-deb
      - name: Installieren, Dienst starten, über systemd neu starten, purgen
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          sudo apt-get update -q
          # Abhängigkeiten müssen aus dem .deb selbst kommen. --no-install-recommends verhindert,
          # dass ein versehentliches Recommends den fehlenden Encoder kaschiert.
          sudo apt-get install -y -q --no-install-recommends "./dist/airdeck_${VER}_amd64.deb"
          command -v ffmpeg >/dev/null || (echo "ffmpeg wurde nicht als Paket-Abhängigkeit installiert" && exit 1)
          ffmpeg -version | head -1
          sudo systemctl is-active airdeck-server.service
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8750/api/v1/health > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8750/api/v1/health | tee health.json
          grep -q '"ok":true' health.json || (echo "Health-Check fehlgeschlagen" && exit 1)
          # journalctl stellt jeder Zeile Zeitstempel/Host/Diensteinheit voran – nur das Token-Muster herausziehen
          TOKEN=$(sudo journalctl -u airdeck-server --no-pager | grep -o 'ad_[A-Za-z0-9_-]*' | head -1)
          test -n "$TOKEN" || (echo "Admin-Token nicht im Protokoll gefunden" && sudo journalctl -u airdeck-server --no-pager && exit 1)
          # Neustart über die API (wie Setup-Assistent/Update): AirDeck erkennt systemd (INVOCATION_ID) und
          # beendet sich mit Exit-Code 75 – RestartForceExitStatus muss den Dienst neu starten (nicht nur beenden).
          PID1=$(sudo systemctl show -p MainPID --value airdeck-server.service)
          curl -fs -X POST -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8750/api/v1/system/restart > /dev/null \
            || (echo "Neustart-Aufruf abgelehnt (Token: '${TOKEN:0:6}…')" && exit 1)
          PID2=""
          for i in $(seq 1 30); do
            sleep 1
            PID2=$(sudo systemctl show -p MainPID --value airdeck-server.service)
            [ -n "$PID2" ] && [ "$PID2" != "0" ] && [ "$PID2" != "$PID1" ] && curl -fs http://127.0.0.1:8750/api/v1/health > /dev/null 2>&1 && break
          done
          if [ "$PID2" = "$PID1" ] || [ -z "$PID2" ] || [ "$PID2" = "0" ]; then
            echo "systemd hat den Dienst nach dem Neustart-Aufruf nicht neu gestartet"
            sudo systemctl status airdeck-server.service --no-pager || true
            exit 1
          fi
          curl -fs http://127.0.0.1:8750/api/v1/health | grep -q '"ok":true'
          echo "Neustart über systemd (Exit-Code 75) OK: PID $PID1 -> $PID2"
          # Entfernen (purge): Programmdateien und Konfiguration weg, Daten (Datenbank, Medien) bleiben.
          # /var/lib/airdeck gehört dem Dienstkonto „airdeck“ und ist nur für dieses (und root) lesbar (750) –
          # der Runner-Benutzer selbst darf ohne sudo gar nicht hineinschauen. Genau das war die eigentliche
          # Ursache des bisherigen Fehlschlags: „test -f“ ohne sudo meldete „nicht gefunden“, obwohl die
          # Datenbank die ganze Zeit da war (siehe Diagnose: „Permission denied“ statt einer leeren Liste).
          sudo test -f /var/lib/airdeck/airdeck.db || (echo "Diagnose: airdeck.db fehlt schon vor dem Stopp/Purge" && sudo ls -la /var/lib/airdeck && sudo journalctl -u airdeck-server --no-pager -n 100 && exit 1)
          sudo systemctl stop airdeck-server.service
          sudo dpkg -P airdeck
          test ! -e /opt/airdeck
          test ! -e /etc/airdeck/airdeck.conf
          sudo test -f /var/lib/airdeck/airdeck.db || (echo "Daten wurden beim Entfernen gelöscht" && sudo ls -la /var/lib/airdeck && exit 1)
          echo "Linux-Paket: Installation, Dienst, Neustart, Health-Check und Purge OK"
      - uses: actions/upload-artifact@v4
        with:
          name: AirDeck-Linux-Deb
          path: dist/airdeck_*.deb
          retention-days: 30

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Handy-Engine testen (Encoder, Mischpult, Sendung an echten Icecast)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q icecast2 ffmpeg > /dev/null
          apps/android/engine/test.sh
      - name: APK bauen (offiziell signiert, falls Keystore hinterlegt – sonst Debug)
        working-directory: apps/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm install --no-audit --no-fund
          mkdir -p out
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/airdeck.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/airdeck.jks"
            npm run build:release
            cp android/app/build/outputs/apk/release/app-release.apk out/AirDeck-Android.apk
            echo "Release-APK (offiziell signiert)"
          else
            npm run build:debug
            cp android/app/build/outputs/apk/debug/app-debug.apk out/AirDeck-Android.apk
            echo "::warning::Kein Keystore hinterlegt (Secret ANDROID_KEYSTORE_B64) – Debug-APK gebaut"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AirDeck-Android
          path: apps/android/out/AirDeck-Android.apk
          retention-days: 30

  # Download-Bereich: Nach jedem Push auf den Hauptbranch liegen Installer, portable Version und APK
  # unter „Releases → AirDeck (aktueller Stand)“, ohne GitHub-Login-Umweg über Artefakte.
  release:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [windows, android, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Nur die eigenen Artefakte laden - "docker-arm64" (docker/build-push-action) legt daneben ein
      # internes Buildx-Cache-Artefakt ab ("<owner>~<repo>~....dockerbuild"), dessen Download
      # gelegentlich fehlschlägt und ohne dieses Muster den ganzen Release-Job unnötig scheitern lässt.
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: 'AirDeck-*' }
      - name: Dateien vorbereiten
        run: |
          mkdir -p out
          cp artifacts/AirDeck-Windows-Installer/*.exe out/AirDeck-Setup.exe
          mv artifacts/AirDeck-Windows artifacts/AirDeck && (cd artifacts && zip -qr ../out/AirDeck-Windows-Portable.zip AirDeck)
          cp artifacts/AirDeck-Android/AirDeck-Android.apk out/AirDeck-Android.apk
          # stabiler Dateiname für den "latest"-Downloadlink; der Paketname (im Innern, für apt) bleibt "airdeck"
          cp artifacts/AirDeck-Linux-Deb/airdeck_*.deb out/AirDeck-Linux.deb
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          # Releases sind im Repository unveränderlich: jeder Build bekommt ein eigenes Release,
          # die Download-Links zeigen über „latest“ immer auf das neueste
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: AirDeck – Build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          body: |
            Automatisch gebaut und getestet aus ${{ github.sha }}.
            • AirDeck-Setup.exe – Windows-Installer (ohne Adminrechte, Deutsch/English, mit Audio-Engine und Android-APK)
            • AirDeck-Windows-Portable.zip – ohne Installation: entpacken, AirDeck.exe starten
            • AirDeck-Android.apk – Android-App: Handy-Sender (Mikrofon + Musik direkt zu laut.fm/Icecast, ohne Server) oder Studio-Fernbedienung für AirDeck auf PC/Server
            • AirDeck-Linux.deb – Linux-Server als systemd-Dienst: `sudo apt install ./AirDeck-Linux.deb` (Debian/Ubuntu, x86_64)
            • Server: docker compose up -d (siehe docs/DOCKER.md)

            Powered by AnMaCha Radioproduktion & RicoReWi – für Broadcast, Automation, Live und laut.fm. Hobbyprojekt, ohne Gewähr.
          files: out/*
